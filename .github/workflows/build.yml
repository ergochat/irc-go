name: "build"

on:
  pull_request:
    branches:
      - "master"
  push:
    branches:
      - "master"

jobs:
  build:
    runs-on: "ubuntu-22.04"
    steps:
      - name: "checkout repository"
        uses: "actions/checkout@v6"
      - name: "setup go"
        uses: "actions/setup-go@v6"
        with:
          go-version: "1.17"
      - name: "make test"
        run: "make test"
      - name: "compile ircevent"
        run: "go build -v ircevent/examples/simple.go"
